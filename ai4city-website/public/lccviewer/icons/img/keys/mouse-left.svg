<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <clipPath id="body-clip-l">
      <rect x="15" y="6" width="18" height="28" rx="9"/>
    </clipPath>
  </defs>
  <!-- 左键填色（用 clipPath 严格裁剪到轮廓内） -->
  <g clip-path="url(#body-clip-l)">
    <rect x="14" y="5" width="10" height="18" fill="white" fill-opacity="0.25"/>
  </g>
  <!-- 鼠标主体 -->
  <rect x="15" y="6" width="18" height="28" rx="9"/>
  <!-- 中线分隔 -->
  <line x1="24" y1="6" x2="24" y2="22"/>
  <!-- 滚轮 -->
  <rect x="22" y="10" width="4" height="7" rx="2"/>
  <!-- 提示光标指向左键 -->
  <path d="M7 36 L7 44 L11 41 L13 45 L15 44 L13 40 L18 40 Z" fill="white"/>
</svg>
